# Study Forge — Worker must run first so /api/* is not swallowed by static assets
name = "study-forge"
main = "worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "../web"
binding = "ASSETS"
# Critical: API routes handled by Worker, not SPA fallback
run_worker_first = true
not_found_handling = "single-page-application"

[[r2_buckets]]
binding = "FILES"
bucket_name = "studyforge"

[[d1_databases]]
binding = "DB"
database_name = "studyforge-db"
database_id = "5f17ed68-d325-46b9-8de7-3e19f943a960"
