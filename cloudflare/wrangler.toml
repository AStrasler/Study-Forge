name = "study-forge"
main = "worker.js"
compatibility_date = "2024-11-01"

# Plain config (not secrets). Change the tunnel URL here when cloudflared gives a new one.
[vars]
LMSTUDIO_BASE_URL = "https://describe-allen-nominated-movement.trycloudflare.com"
# Optional: must match the model name loaded in LM Studio
# LMSTUDIO_MODEL = "local-model"

[assets]
directory = "../web"
binding = "ASSETS"
run_worker_first = true

[[r2_buckets]]
binding = "FILES"
bucket_name = "studyforge"

[[d1_databases]]
binding = "DB"
database_name = "studyforge-db"
database_id = "5f17ed68-d325-46b9-8de7-3e19f943a960"
