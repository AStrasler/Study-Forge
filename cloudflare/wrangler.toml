# Study Forge — primary web route on Cloudflare: Worker + R2 + D1
name = "study-forge-api"
main = "worker.js"
compatibility_date = "2024-11-01"

# After domain Active, optional:
# routes = [{ pattern = "api.studyforge.studio/*", zone_name = "studyforge.studio" }]

[[r2_buckets]]
binding = "FILES"
bucket_name = "studyforge"

[[d1_databases]]
binding = "DB"
database_name = "studyforge-db"
database_id = "REPLACE_AFTER_CREATE"
