name = "study-forge"
main = "worker.js"
compatibility_date = "2024-11-01"

# Non-secret defaults only. Instance-specific values (tunnel URL, API keys)
# go in the Worker secret store — not this public file:
#   wrangler secret put LMSTUDIO_BASE_URL
#   wrangler secret put LMSTUDIO_MODEL
#   wrangler secret put GROQ_API_KEY

[assets]
directory = "../web"
binding = "ASSETS"
run_worker_first = true

[[r2_buckets]]
binding = "FILES"
bucket_name = "studyforge"

[[d1_databases]]
binding = "DB"
database_name = "studyforge-db"
database_id = "5f17ed68-d325-46b9-8de7-3e19f943a960"
