# Study Forge — primary web route (matches existing Worker name)
name = "study-forge"
main = "worker.js"
compatibility_date = "2024-11-01"

# Static UI from repo web/
[assets]
directory = "../web"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[r2_buckets]]
binding = "FILES"
bucket_name = "studyforge"

[[d1_databases]]
binding = "DB"
database_name = "studyforge-db"
database_id = "5f17ed68-d325-46b9-8de7-3e19f943a960"
