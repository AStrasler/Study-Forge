<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Forge</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0B0D10;color:#EDEEF0;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:24px}
h1{font-size:22px;margin:0 0 8px}
.sub{color:#8A909B;font-size:14px;margin-bottom:20px}
.box{background:#14171C;border:1px solid #262B33;border-radius:12px;padding:16px;margin-bottom:16px}
.drop{border:1px dashed #262B33;border-radius:8px;padding:28px;text-align:center;cursor:pointer;color:#8A909B}
.drop:hover{border-color:#FF7A33}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #1E222A;font-size:13px}
.row:last-child{border:0}
.st{font-size:10px;font-weight:700;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:#1B1F26;color:#8A909B}
.st.forged{background:rgba(74,222,128,.14);color:#4ADE80}
.st.forging{background:rgba(255,122,51,.14);color:#FF7A33}
.st.failed{background:rgba(248,113,113,.14);color:#F87171}
button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;font-weight:600}
.primary{background:#FF7A33;color:#1a0900}
.ghost{background:#1B1F26;color:#EDEEF0;border:1px solid #262B33}
.danger{background:rgba(248,113,113,.14);color:#F87171}
.notes{white-space:pre-wrap;font-size:14px;line-height:1.6}
.meta{color:#5B616C;font-size:12px;margin:8px 0}
.chip{display:inline-block;font-size:12px;padding:4px 10px;border-radius:99px;background:rgba(74,222,128,.14);color:#4ADE80}
.chip.bad{background:rgba(248,113,113,.14);color:#F87171}
#login{max-width:360px;margin:80px auto;padding:24px}
#app{display:none}
</style>
</head>
<body>

<div id="login" class="box">
  <h1>Study Forge</h1>
  <p class="sub">Cloud queue · notes on screen · copy to Notion yourself</p>
  <button class="primary" type="button" id="go" style="width:100%">Enter the forge</button>
</div>

<div id="app" class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h1>Study Forge</h1>
    <span class="chip" id="chip">…</span>
  </div>
  <p class="sub" id="hint"></p>

  <div class="box">
    <div class="drop" id="drop">Drop .txt / .md or click to upload
      <input type="file" id="file" accept=".txt,.md,.markdown" hidden>
    </div>
  </div>

  <div class="box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <strong>Queue / history</strong>
      <button type="button" class="danger" id="clear">Clear failed</button>
    </div>
    <div id="list">Loading…</div>
  </div>

  <div class="box" id="notesBox" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong id="notesTitle">Notes</strong>
      <button type="button" class="ghost" id="copy">Copy all</button>
    </div>
    <div class="meta" id="notesMeta"></div>
    <div class="notes" id="notesBody"></div>
  </div>
</div>

<script>
var API = localStorage.getItem("sf_api_base") || "https://study-forge.aaron-m-strasler.workers.dev";

document.getElementById("go").onclick = async function () {
  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";
  await ping();
  await refresh();
  setInterval(refresh, 4000);
};

async function ping() {
  var chip = document.getElementById("chip");
  var hint = document.getElementById("hint");
  try {
    var res = await fetch(API + "/api/health");
    var data = await res.json();
    if (!data.ok) throw new Error("bad");
    chip.className = "chip";
    chip.textContent = data.groq ? "API + Groq" : "API up · need GROQ secret";
    hint.textContent = "API " + API;
  } catch (e) {
    chip.className = "chip bad";
    chip.textContent = "API offline";
    hint.textContent = "Cannot reach " + API;
  }
}

var drop = document.getElementById("drop");
var file = document.getElementById("file");
drop.onclick = function () { file.click(); };
drop.ondragover = function (e) { e.preventDefault(); };
drop.ondrop = function (e) {
  e.preventDefault();
  if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
};
file.onchange = function () {
  if (file.files[0]) upload(file.files[0]);
};

document.getElementById("clear").onclick = async function () {
  if (!confirm("Clear failed jobs?")) return;
  await fetch(API + "/api/jobs/clear-failed", { method: "POST" });
  refresh();
};

document.getElementById("copy").onclick = async function () {
  var t = document.getElementById("notesBody").innerText;
  if (!t) return;
  try {
    await navigator.clipboard.writeText(t);
    alert("Copied");
  } catch (e) {
    alert("Copy manually");
  }
};

async function upload(f) {
  var fd = new FormData();
  fd.append("file", f);
  try {
    var res = await fetch(API + "/api/jobs", { method: "POST", body: fd });
    var data = await res.json().catch(function () { return {}; });
    if (!res.ok) {
      alert(data.error || ("Upload failed " + res.status));
      return;
    }
    await refresh();
  } catch (e) {
    alert(String(e.message || e));
  }
  file.value = "";
}

async function openNotes(id, name) {
  var box = document.getElementById("notesBox");
  box.style.display = "block";
  document.getElementById("notesTitle").textContent = name || "Notes";
  document.getElementById("notesBody").textContent = "Loading…";
  var res = await fetch(API + "/api/jobs/" + id + "/result");
  var data = await res.json().catch(function () { return {}; });
  if (!res.ok) {
    document.getElementById("notesMeta").textContent = data.error || data.detail || "No notes";
    document.getElementById("notesBody").textContent = "";
    return;
  }
  var n = data.notes || {};
  document.getElementById("notesMeta").textContent = (n.provider_used || "") + " " + (n.processed_at || "");
  document.getElementById("notesBody").textContent = n.full_notes || "";
}

async function dismiss(id) {
  await fetch(API + "/api/jobs/" + id, { method: "DELETE" });
  refresh();
}

function esc(s) {
  return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

async function refresh() {
  try {
    var res = await fetch(API + "/api/jobs");
    if (!res.ok) {
      document.getElementById("list").textContent = "HTTP " + res.status;
      return;
    }
    var data = await res.json();
    var jobs = data.jobs || [];
    if (!jobs.length) {
      document.getElementById("list").innerHTML = "<p class=\"meta\">No jobs yet</p>";
      return;
    }
    var html = "";
    for (var i = 0; i < jobs.length; i++) {
      var j = jobs[i];
      var st = (j.status || "queued").toLowerCase();
      html += "<div class=\"row\">";
      html += "<div style=\"flex:1;min-width:0\"><div>" + esc(j.filename) + "</div>";
      if (st === "failed" && j.error) html += "<div class=\"meta\" style=\"color:#F87171\">" + esc(j.error) + "</div>";
      html += "</div><span class=\"st " + st + "\">" + st + "</span>";
      if (st === "forged") {
        html += " <button type=\"button\" class=\"ghost\" data-open=\"" + esc(j.id) + "\" data-name=\"" + esc(j.filename) + "\">Open</button>";
      }
      if (st === "failed") {
        html += " <button type=\"button\" class=\"danger\" data-del=\"" + esc(j.id) + "\">Dismiss</button>";
      }
      html += "</div>";
    }
    document.getElementById("list").innerHTML = html;
    var opens = document.querySelectorAll("[data-open]");
    for (var a = 0; a < opens.length; a++) {
      opens[a].onclick = (function (btn) {
        return function () { openNotes(btn.getAttribute("data-open"), btn.getAttribute("data-name")); };
      })(opens[a]);
    }
    var dels = document.querySelectorAll("[data-del]");
    for (var b = 0; b < dels.length; b++) {
      dels[b].onclick = (function (btn) {
        return function () { dismiss(btn.getAttribute("data-del")); };
      })(dels[b]);
    }
  } catch (e) {
    document.getElementById("list").textContent = String(e.message || e);
  }
}
</script>
</body>
</html>
